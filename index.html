<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c2041">
<title>Jane Salles | Controle de Encomendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{font-family:'DM Sans',Arial,sans-serif;color:#16253d;background:#f5f7fb;--navy:#0e2140;--red:#d62f43;--line:#e8ecf2;--muted:#758198}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.shell{display:flex;min-height:100vh}.side{width:250px;flex-shrink:0;background:#0e2140;color:#fff;padding:30px 19px;display:flex;flex-direction:column;gap:32px}.brand{display:flex;align-items:center;justify-content:center;padding:12px 8px;background:#fff;border-radius:14px}.brand img{display:block;width:100%;height:auto;max-height:125px;object-fit:contain}.mark{width:43px;height:43px;border:2px solid #e04755;border-radius:12px;display:grid;place-items:center;font-size:25px}.brand strong{font-family:'Playfair Display',Georgia,serif;font-size:22px;line-height:1}.brand small{display:block;font-size:9px;letter-spacing:2.2px;margin-top:6px;color:#dce1eb}.nav{display:grid;gap:8px}.nav button{color:#b9c5d6;background:transparent;border:0;border-radius:11px;padding:14px 16px;text-align:left;font-weight:700}.nav button.active,.nav button:hover{background:#243b5b;color:white}.sidefoot{margin-top:auto;color:#91a0b7;font-size:12px;padding:12px}.main{flex:1;min-width:0;max-width:1450px;margin:auto;padding:35px 42px 75px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}.eyebrow{text-transform:uppercase;letter-spacing:2.2px;font-size:11px;color:var(--red);font-weight:800}.top h1{font-size:29px;letter-spacing:-.9px;margin:5px 0}.muted{color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:white;color:var(--navy);border-radius:11px;padding:11px 15px;font-size:13px;font-weight:800;white-space:nowrap}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.dark{background:var(--navy);color:white;border-color:var(--navy)}.btn.ghost{background:#f4f6f9}.actions{display:flex;gap:9px;flex-wrap:wrap}.months{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.month{background:white;border:1px solid var(--line);border-radius:10px;padding:11px 17px;font-size:13px;font-weight:800;color:#60708a}.month.active{background:var(--navy);border-color:var(--navy);color:white}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:24px}.stat,.panel{border:1px solid var(--line);border-radius:17px;background:white;box-shadow:0 4px 18px #152a4b08}.stat{padding:22px}.stat .ico{font-size:20px;color:var(--red)}.stat .num{font-size:27px;font-weight:800;letter-spacing:-1px;margin:13px 0 3px}.stat .lab{color:var(--muted);font-size:12px}.panel{padding:23px;margin-bottom:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.panelhead h2{font-size:17px;margin:0}.search{padding:11px 14px;border:1px solid var(--line);border-radius:10px;outline:none;min-width:210px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:var(--muted);font-size:11px;letter-spacing:.4px;text-transform:uppercase;background:#f8f9fc;padding:13px 12px}td{padding:16px 12px;border-top:1px solid var(--line)}.person{font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:3px}.status{display:inline-block;padding:6px 9px;border-radius:8px;font-size:11px;font-weight:800;background:#eef1fa;color:#344c7b}.status.transporte{background:#e8f1ff;color:#315ca2}.status.entregue{background:#e4f7ed;color:#187c4b}.status.comprado{background:#fff0dc;color:#a76716}.status.solicitado{background:#fce9eb;color:#ba3b49}.link{border:0;background:none;color:var(--red);font-weight:800;font-size:12px;padding:6px}.empty{text-align:center;padding:38px 8px;color:var(--muted)}.empty strong{display:block;color:var(--navy);margin-bottom:7px}.modal{position:fixed;inset:0;background:#0b1734a3;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.open{display:flex}.dialog{width:min(620px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:19px;padding:25px}.dialog h2{margin:0 0 20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:6px;font-size:12px;font-weight:800;color:#526077}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{border-radius:10px;border:1px solid #dce2ed;padding:12px;min-width:0;outline-color:#91a6c9}.field textarea{resize:vertical}.dialogfooter{display:flex;justify-content:flex-end;gap:9px;margin-top:23px}.smallgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tip{background:#f6f8fc;border-radius:12px;padding:17px;color:#5f6e85;line-height:1.65;font-size:13px}.hidden{display:none!important}@media(max-width:900px){.side{width:190px}.main{padding:25px 20px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{display:block}.side{width:100%;padding:14px;gap:13px}.brand{justify-content:center}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap;padding:10px}.sidefoot{display:none}.main{padding:24px 14px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:26px}.stats{gap:8px}.stat{padding:15px}.stat .num{font-size:20px}.panel{padding:15px}.panelhead{align-items:flex-start;flex-direction:column}.search{width:100%}.fields{grid-template-columns:1fr}.smallgrid{grid-template-columns:1fr}}
.wa{display:inline-flex;align-items:center;margin-top:6px;border-radius:7px;background:#e4f8ec;color:#087a3d;text-decoration:none;padding:6px 9px;font-size:11px;font-weight:800;white-space:nowrap}.wa:hover{background:#c7efd7}@media(max-width:650px){.wa{padding:7px 9px}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="brand"><img src="logojane.png" onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='logojane.jpg'}else if(this.dataset.fallback==='1'){this.dataset.fallback='2';this.src='logojane.jpeg'}else if(this.dataset.fallback==='2'){this.dataset.fallback='3';this.src='logojane.webp'}else if(this.dataset.fallback==='3'){this.dataset.fallback='4';this.src='logojane.svg'}else{this.style.display='none';this.parentElement.textContent='Jane Salles | Imports USA'}" alt="Jane Salles Imports USA — logotipo"></div><nav class="nav"><button class="active" data-view="pedidos">▦ &nbsp; Pedidos</button><button data-view="clientes">♙ &nbsp; Clientes</button><button data-view="financeiro">◈ &nbsp; Financeiro</button><button data-view="ajustes">⚙ &nbsp; Backup</button></nav><div class="sidefoot">Encomendas internacionais ✦</div></aside><main class="main"><div class="top"><div><div class="eyebrow">Seu espaço de trabalho</div><h1 id="pageTitle">Controle de encomendas</h1><div class="muted">Organize clientes, compras e recebimentos em um só lugar.</div></div><div class="actions"><button class="btn primary" id="newOrder">+ Novo pedido</button></div></div><div id="monthArea"><div class="months" id="months"></div><div class="stats" id="stats"></div></div><section id="content"></section></main></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><form class="dialog" id="orderForm"><h2 id="dialogTitle">Novo pedido</h2><div class="fields"><label class="field">Cliente *<input id="fCliente" required maxlength="100" placeholder="Nome da cliente"></label><label class="field">WhatsApp<input id="fTelefone" type="tel" maxlength="25" placeholder="(00) 00000-0000"></label><label class="field full">Produto *<input id="fProduto" required maxlength="160" placeholder="Ex.: iPhone, perfume, suplemento..."></label><label class="field">Quantidade<input id="fQtd" type="number" min="1" step="1" value="1" required></label><label class="field">Status<select id="fStatus"><option>Solicitado</option><option>Comprado</option><option>Em transporte</option><option>Chegou ao Brasil</option><option>Entregue</option></select></label><label class="field">Custo total (R$)<input id="fCusto" type="number" min="0" step="0.01" value="0"></label><label class="field">Valor cobrado (R$)<input id="fVenda" type="number" min="0" step="0.01" value="0"></label><label class="field">Valor recebido (R$)<input id="fPago" type="number" min="0" step="0.01" value="0"></label><label class="field">Data do pedido<input id="fData" type="date"></label><label class="field full">Observações<textarea id="fObs" rows="2" placeholder="Cor, modelo, entrega, detalhes..."></textarea></label></div><div class="dialogfooter"><button type="button" class="btn" id="cancel">Cancelar</button><button type="submit" class="btn primary">Salvar pedido</button></div></form></div>
<script>
(()=>{'use strict';const KEY='jane_salles_orders_v1',money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const labels=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];let initial='2026-11';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.months)||!Array.isArray(data.orders))data={months:[initial],orders:[]};let month=data.months.includes(initial)?initial:data.months[0],view='pedidos',editing=null;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Não foi possível salvar. Exporte o backup e confira o espaço do navegador.')}}const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const whatsapp=phone=>{let n=String(phone||'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);if(n.length===10||n.length===11)n='55'+n;return n.length>=12&&n.length<=15?'https://wa.me/'+n:''};const whatsButton=phone=>{let url=whatsapp(phone);return url?`<a class="wa" href="${url}" target="_blank" rel="noopener noreferrer" title="Conversar no WhatsApp">◉ WhatsApp ↗</a>`:'<span class="sub">Sem telefone</span>'};const title=k=>{const [y,m]=k.split('-');return labels[Number(m)-1]+' '+y};const orders=()=>data.orders.filter(o=>o.month===month);function stat(){let a=orders();return {total:a.length,pend:a.reduce((s,o)=>s+Math.max(0,o.venda-o.pago),0),del:a.filter(o=>o.status==='Entregue').length,lucro:a.reduce((s,o)=>s+o.venda-o.custo,0),vendas:a.reduce((s,o)=>s+o.venda,0),pago:a.reduce((s,o)=>s+o.pago,0)}}function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('pageTitle').textContent=({pedidos:'Controle de encomendas',clientes:'Minhas clientes',financeiro:'Resumo financeiro',ajustes:'Backup e segurança'})[view];$('newOrder').classList.toggle('hidden',view==='ajustes');$('monthArea').classList.toggle('hidden',view==='ajustes'||view==='clientes');$('months').innerHTML=data.months.map(m=>`<button class="month ${m===month?'active':''}" data-month="${safe(m)}">${safe(title(m))}</button>`).join('')+'<button class="btn" id="addMonth">+ Novo mês</button><button class="btn ghost" id="duplicateMonth">⧉ Duplicar estrutura</button>';if(view!=='ajustes'&&view!=='clientes'){let s=stat();$('stats').innerHTML=[['◫',s.total,'Pedidos'],['◈',money(s.pend),'A receber'],['✓',s.del,'Entregues'],['↗',money(s.lucro),'Lucro estimado']].map(x=>`<div class="stat"><div class="ico">${x[0]}</div><div class="num">${x[1]}</div><div class="lab">${x[2]}</div></div>`).join('')}let c=$('content');if(view==='pedidos'){c.innerHTML=`<div class="panel"><div class="panelhead"><div><h2>Pedidos de ${safe(title(month))}</h2><div class="muted">Acompanhe as encomendas deste mês.</div></div><input class="search" id="search" placeholder="Buscar cliente ou produto..."></div><div class="tablewrap" id="orderTable"></div></div>`;drawTable()}else if(view==='clientes'){let map=new Map();data.orders.forEach(o=>{let k=o.cliente.toLowerCase().trim();if(!map.has(k))map.set(k,{nome:o.cliente,telefone:o.telefone,total:0,qtd:0});let v=map.get(k);v.total+=o.venda;v.qtd++;if(o.telefone)v.telefone=o.telefone});c.innerHTML=`<div class="panel"><div class="panelhead"><h2>Clientes cadastradas</h2><span class="muted">Geradas automaticamente a partir dos pedidos</span></div><div class="tablewrap"><table><thead><tr><th>Nome</th><th>WhatsApp</th><th>Pedidos</th><th>Total em vendas</th></tr></thead><tbody>${[...map.values()].map(o=>`<tr><td class="person">${safe(o.nome)}</td><td><div>${safe(o.telefone||'—')}</div>${whatsButton(o.telefone)}</td><td>${o.qtd}</td><td>${money(o.total)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhuma cliente ainda.</td></tr>'}</tbody></table></div></div>`}else if(view==='financeiro'){let s=stat();c.innerHTML=`<div class="smallgrid"><div class="panel"><h2>Financeiro de ${safe(title(month))}</h2><p class="muted">Total de vendas</p><h1>${money(s.vendas)}</h1><p class="muted">Já recebido</p><h2>${money(s.pago)}</h2><p class="muted">Falta receber</p><h2>${money(s.pend)}</h2></div><div class="panel"><h2>Lucro estimado</h2><h1>${money(s.lucro)}</h1><div class="tip">Calculado como valor cobrado menos o custo informado. Não considera impostos, taxas ou despesas não cadastradas. Valores são estimativas, não um relatório contábil.</div></div></div>`}else{c.innerHTML=`<div class="panel"><h2>Seus dados, seu controle</h2><p class="muted">Os pedidos são salvos somente neste navegador. Faça backup regularmente, principalmente antes de trocar de celular ou computador.</p><div class="actions"><button class="btn dark" id="export">↓ Exportar backup</button><label class="btn" style="cursor:pointer">↑ Importar backup<input id="import" type="file" accept="application/json" style="display:none"></label></div></div><div class="tip">O GitHub Pages hospeda a página, mas não sincroniza os pedidos. Abrir o link em outro aparelho não mostrará os registros sem importar um backup. Este sistema não tem login nem banco de dados remoto.</div>`}}function drawTable(){let el=$('orderTable');if(!el)return;let term=($('search')?.value||'').toLowerCase(),a=orders().filter(o=>(o.cliente+' '+o.produto).toLowerCase().includes(term));if(!a.length){el.innerHTML='<div class="empty"><strong>Nenhum pedido encontrado</strong>Toque em “Novo pedido” para cadastrar a primeira encomenda.</div>';return}el.innerHTML=`<table><thead><tr><th>Cliente</th><th>Produto</th><th>Venda</th><th>Pendente</th><th>Status</th><th></th></tr></thead><tbody>${a.map(o=>`<tr><td><div class="person">${safe(o.cliente)}</div><div class="sub">${safe(o.telefone)}</div>${whatsButton(o.telefone)}</td><td>${safe(o.produto)}<div class="sub">Qtd. ${Number(o.qtd)||1}</div></td><td>${money(o.venda)}</td><td>${money(Math.max(0,o.venda-o.pago))}</td><td><span class="status ${o.status==='Entregue'?'entregue':o.status==='Comprado'?'comprado':o.status==='Em transporte'?'transporte':'solicitado'}">${safe(o.status)}</span></td><td><button class="link" data-edit="${safe(o.id)}">Editar</button></td></tr>`).join('')}</tbody></table>`}function openForm(id){let o=data.orders.find(x=>x.id===id);editing=o?.id||null;$('dialogTitle').textContent=o?'Editar pedido':'Novo pedido';$('orderForm').reset();let vals={Cliente:o?.cliente||'',Telefone:o?.telefone||'',Produto:o?.produto||'',Qtd:o?.qtd||1,Status:o?.status||'Solicitado',Custo:o?.custo||0,Venda:o?.venda||0,Pago:o?.pago||0,Data:o?.data||new Date().toISOString().slice(0,10),Obs:o?.obs||''};Object.entries(vals).forEach(([k,v])=>$('f'+k).value=v);$('modal').classList.add('open');$('fCliente').focus()}function close(){ $('modal').classList.remove('open')}function monthAdd(copy){let d=new Date(month+'-01T12:00:00');d.setMonth(d.getMonth()+1);let candidate=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');let input=prompt(copy?'Qual mês deseja criar? (AAAA-MM) — apenas a estrutura será duplicada':'Informe o novo mês (AAAA-MM)',candidate);if(input===null)return;input=input.trim();if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(input)){alert('Use o formato AAAA-MM, exemplo: 2026-12');return}if(data.months.includes(input)){month=input;render();return}data.months.push(input);data.months.sort();month=input;save();render()}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render()}else if(b.dataset.month){month=b.dataset.month;render()}else if(b.id==='addMonth'||b.id==='duplicateMonth')monthAdd(b.id==='duplicateMonth');else if(b.id==='newOrder')openForm();else if(b.dataset.edit)openForm(b.dataset.edit);else if(b.id==='cancel')close();else if(b.id==='export'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='jane-salles-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});document.addEventListener('input',e=>{if(e.target.id==='search')drawTable()});$('orderForm').addEventListener('submit',e=>{e.preventDefault();let n=id=>$(id).value.trim(),num=id=>Math.max(0,Number($(id).value)||0);let o={id:editing||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())),month:editing?(data.orders.find(x=>x.id===editing)?.month||month):month,cliente:n('fCliente'),telefone:n('fTelefone'),produto:n('fProduto'),qtd:Math.max(1,Math.round(num('fQtd'))),status:n('fStatus'),custo:num('fCusto'),venda:num('fVenda'),pago:num('fPago'),data:n('fData'),obs:n('fObs')};if(o.pago>o.venda&&!confirm('O valor recebido é maior que o valor cobrado. Deseja salvar mesmo assim?'))return;if(editing){data.orders=data.orders.map(x=>x.id===editing?o:x)}else data.orders.push(o);save();close();render()});$('modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});document.addEventListener('change',async e=>{if(e.target.id!=='import')return;let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.months)||!Array.isArray(obj.orders)||obj.orders.some(o=>!o||typeof o.cliente!=='string'))throw Error('Formato inválido');if(!confirm('Importar este backup vai substituir os dados atuais neste navegador. Continuar?'))return;data={months:obj.months,orders:obj.orders};month=data.months[0]||initial;save();view='pedidos';render();alert('Backup importado com sucesso!')}catch{alert('Não foi possível ler esse arquivo de backup.')}e.target.value=''});render()})();
</script>
</body></html>
